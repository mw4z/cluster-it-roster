<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Cluster IT Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f6f8;
      --tile: #ffffff;
      --line: #e4e7eb;
      --line-strong: #d3d8de;
      --text: #1d2125;
      --text-2: #4a5059;
      --muted: #8a9099;
      --faint: #b9bec5;
      --blue: #2f80ed;
      --blue-press: #1f6fdb;
      --blue-soft: #eaf2fd;
      --green: #1f9d6b;
      --red: #d64545;
      --red-soft: #fdeeee;
      --amber: #c7811a;
      --shadow-bar: 0 -1px 0 var(--line), 0 -6px 16px rgba(16, 24, 40, .04);

      --c-M: #2f80ed;  --c-M-bg: #eaf2fd;
      --c-B: #c7811a;  --c-B-bg: #fdf4e6;
      --c-E: #7b52d6;  --c-E-bg: #f2edfc;
      --c-N: #3d4a9e;  --c-N-bg: #eceefa;
      --c-off: #6f7680; --c-off-bg: #f1f2f4;
      --c-leave: #1f9d6b; --c-leave-bg: #e8f6f0;
      --c-task: #c2417a; --c-task-bg: #fcecf3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417;
        --surface: #1a1d21;
        --tile: #1f2328;
        --line: #2b3036;
        --line-strong: #39404a;
        --text: #eceef1;
        --text-2: #c2c7ce;
        --muted: #8b929b;
        --faint: #5b626b;
        --blue: #4b93f2;
        --blue-press: #3a83e6;
        --blue-soft: #1c2a3d;
        --red-soft: #3a1f21;
        --shadow-bar: 0 -1px 0 var(--line);
        --c-M-bg: #1c2a3d; --c-B-bg: #33281a; --c-E-bg: #2a2340; --c-N-bg: #22263d;
        --c-off-bg: #262a30; --c-leave-bg: #17302a; --c-task-bg: #36202b;
        --c-N: #8c98e8; --c-E: #a98af0; --c-B: #e0a248;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    svg { display: block; }

    .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
    @media (min-width: 600px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }

    /* App bar */
    .appbar { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 8px; position: sticky; top: 0; z-index: 20; background: var(--bg); }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--text-2); position: relative; }
    .icon-btn:hover { background: var(--surface); }
    .wordmark { font-weight: 700; font-size: 21px; letter-spacing: -0.5px; margin-left: 2px; flex: 1; white-space: nowrap; }
    .wordmark span { color: var(--blue); }
    .bell { border: 1px solid var(--line); width: 36px; height: 36px; }
    .bell .dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; background: var(--red); border-radius: 50%; border: 2px solid var(--bg); display: none; }
    .bell.has-alert .dot { display: block; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: #1d2125; color: #fff; font-weight: 600; font-size: 13px; display: grid; place-items: center; margin-left: 4px; }
    @media (prefers-color-scheme: dark) { .avatar { background: #eceef1; color: #121417; } }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; position: sticky; top: 60px; z-index: 19; background: var(--bg); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 10px 13px; color: var(--muted); font-weight: 500; font-size: 15px; position: relative; white-space: nowrap; }
    .tab .num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    .tab.active { color: var(--text); font-weight: 600; }
    .tab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px; }
    .tab.active .num { background: var(--blue); color: #fff; }
    .tab .num.ok { background: var(--green); color: #fff; }
    .tab .num.warn { background: var(--red); color: #fff; }

    main { flex: 1; padding: 16px 16px 180px; }
    .view[hidden] { display: none; }

    /* Calendar strip */
    .cal { background: var(--surface); border-radius: 10px; padding: 8px 8px 12px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 6px; }
    .cal-title { font-size: 15px; color: var(--text-2); font-weight: 500; }
    .cal-nav { width: 34px; height: 34px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
    .cal-nav:disabled { opacity: .45; cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
    .cal-dow { font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
    .cal-day { justify-self: center; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; font-weight: 600; color: var(--text); position: relative; display: grid; place-items: center; }
    .cal-day:hover:not(:disabled) { background: var(--bg); }
    .cal-day:disabled { color: var(--faint); font-weight: 500; cursor: default; }
    .cal-day.today:not(.selected) { background: var(--line); }
    .cal-day.selected { box-shadow: inset 0 0 0 1.5px var(--blue); color: var(--blue); background: var(--bg); }
    .cal-day .gap-dot { position: absolute; bottom: 3px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--red); }

    /* Panels & tiles */
    .panel { background: var(--surface); border-radius: 10px; padding: 0 8px 8px; margin-top: 14px; }
    .panel-head { font-size: 14px; color: var(--muted); text-align: center; padding: 12px 8px 10px; }
    .panel-head strong { color: var(--text-2); font-weight: 500; }
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { background: var(--tile); border: 1px solid var(--line-strong); border-radius: 4px; padding: 12px 10px 10px; min-height: 64px; min-width: 0; }
    .tile.wide { grid-column: 1 / -1; }
    .tile-title { text-align: center; font-weight: 600; font-size: 16px; }
    .tile-sub { text-align: center; font-size: 13px; color: var(--muted); margin-top: 1px; }
    .tile-sub.warn { color: var(--red); font-weight: 500; }
    .people { list-style: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
    .person { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 5px 2px; font-size: 14px; color: var(--text); border-radius: 4px; }
    .person:hover { background: var(--surface); }
    .person .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; white-space: nowrap; letter-spacing: .1px; }
    .tag.ic { background: #fff4dc; color: #8a5a00; }
    .tag.call { background: var(--red-soft); color: var(--red); }
    .tag.mod { background: var(--blue-soft); color: var(--blue); }
    .tag.po { background: var(--c-off-bg); color: var(--c-off); }
    @media (prefers-color-scheme: dark) { .tag.ic { background: #3a2f17; color: #f0c56a; } }
    .person.me .nm { font-weight: 700; }

    .rows { background: var(--tile); border: 1px solid var(--line-strong); border-radius: 4px; }
    .row { display: flex; align-items: baseline; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row-label { font-weight: 600; font-size: 14px; min-width: 104px; }
    .row-val { flex: 1; font-size: 14px; color: var(--text-2); }
    .row-val .person { display: inline; padding: 0; }
    .row-count { font-size: 13px; color: var(--muted); }

    .bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--green); }

    .section-label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 22px 2px 8px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
    .banner { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px; background: #fff7e6; color: #7a5300; border: 1px solid #f3dfb3; }
    @media (prefers-color-scheme: dark) { .banner { background: #2f2717; color: #f0c56a; border-color: #4a3c1d; } }

    /* Week table */
    .week-wrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--tile); }
    table.week { border-collapse: collapse; width: 100%; font-size: 13px; }
    .week th, .week td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
    .week thead th { padding: 8px 2px; font-weight: 500; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--tile); }
    .week thead th b { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
    .week thead th.is-sel b { color: var(--blue); }
    .week th.name { text-align: left; padding: 6px 10px; font-weight: 500; white-space: nowrap; position: sticky; left: 0; background: var(--tile); color: var(--text); font-size: 13px; min-width: 112px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .week tr.me th.name { font-weight: 700; }
    .week tr.me td, .week tr.me th { background: var(--blue-soft); }
    .week td { padding: 5px 2px; min-width: 40px; }
    .week tfoot td, .week tfoot th { color: var(--muted); font-size: 12px; padding: 6px 2px; border-bottom: 0; }
    .chip { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 4px; border-radius: 4px; font-weight: 600; font-size: 12px; position: relative; }
    .chip.called::after { content: ""; position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: var(--red); border-radius: 50%; border: 1.5px solid var(--tile); }
    .k-M { color: var(--c-M); background: var(--c-M-bg); }
    .k-B { color: var(--c-B); background: var(--c-B-bg); }
    .k-E { color: var(--c-E); background: var(--c-E-bg); }
    .k-N { color: var(--c-N); background: var(--c-N-bg); }
    .k-off { color: var(--c-off); background: var(--c-off-bg); }
    .k-leave { color: var(--c-leave); background: var(--c-leave-bg); }
    .k-task { color: var(--c-task); background: var(--c-task-bg); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }

    /* On duty */
    .clock { text-align: center; padding: 18px 0 4px; }
    .clock .t { font-size: 40px; font-weight: 600; letter-spacing: -1px; }
    .clock .s { color: var(--muted); font-size: 14px; }
    .duty-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); }
    .duty-row:first-child { border-top: 0; }
    .initials { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
    .duty-row .who { flex: 1; min-width: 0; }
    .duty-row .who b { display: block; font-weight: 600; font-size: 15px; }
    .duty-row .who small { color: var(--muted); font-size: 13px; }

    /* Me */
    .me-pick { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    select.input, input.input { flex: 1; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--tile); color: var(--text); }
    .stat-tile .big { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-top: 2px; }
    .day-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
    .day-row:first-child { border-top: 0; }
    .day-row .d { width: 44px; text-align: center; flex: none; }
    .day-row .d small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .day-row .d b { font-size: 18px; font-weight: 600; }
    .day-row.today .d b { color: var(--blue); }
    .day-row .what { flex: 1; font-size: 15px; }
    .day-row .what small { display: block; color: var(--muted); font-size: 13px; }

    .file-row { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 12px; border-top: 1px solid var(--line); }
    .file-row:first-child { border-top: 0; }
    .file-main { flex: 1; min-width: 0; font-size: 14px; }
    .file-main b { font-weight: 600; word-break: break-word; }
    .file-main small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .file-row .link-btn { width: 36px; height: 36px; justify-content: center; border-radius: 6px; }
    .file-row .link-btn:hover { background: var(--surface); }
    button.chip { border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 12px; }
    button.chip:hover { box-shadow: inset 0 0 0 1px currentColor; }

    /* Bottom bar */
    .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); box-shadow: var(--shadow-bar); }
    .bottombar-inner { max-width: 560px; margin: 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    .bb-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; }
    .bb-line + .bb-line { margin-top: 2px; }
    .bb-main { font-weight: 600; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bb-sub { color: var(--muted); font-size: 14px; }
    .bb-strong { font-weight: 700; font-size: 16px; }
    .link-btn { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 14px; padding: 4px 2px; flex: none; }
    .link-btn:hover { color: var(--blue); }
    .bb-actions { display: flex; gap: 8px; margin-top: 10px; }
    .sq-btn { width: 46px; height: 44px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text-2); flex: none; }
    .primary { flex: 1; height: 44px; border-radius: 6px; background: var(--blue); color: #fff; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .primary:hover { background: var(--blue-press); }
    .primary:disabled { opacity: .5; }

    /* Sheet */
    .scrim { position: fixed; inset: 0; background: rgba(16, 20, 26, .38); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; transform: translateY(100%); transition: transform .22s ease; pointer-events: none; }
    .sheet.open { transform: none; pointer-events: auto; }
    .sheet-inner { max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
    .grabber { width: 36px; height: 4px; background: var(--line-strong); border-radius: 2px; margin: 4px auto 12px; }
    .sheet h2 { font-size: 17px; font-weight: 600; }
    .sheet p.hint { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .opt-list { margin-top: 12px; border: 1px solid var(--line-strong); border-radius: 6px; }
    .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border-top: 1px solid var(--line); font-size: 15px; }
    .opt:first-child { border-top: 0; }
    .opt:hover { background: var(--surface); }
    .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; }
    .opt.on .radio { border: 5px solid var(--blue); }
    .opt small { margin-left: auto; color: var(--muted); font-size: 13px; }
    .sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
    .ghost { flex: 1; height: 44px; border-radius: 6px; border: 1px solid var(--line-strong); font-weight: 500; }

    .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(10px); background: #1d2125; color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 14px; z-index: 50; opacity: 0; transition: all .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%); }

    .skeleton { height: 120px; border-radius: 10px; background: var(--surface); margin-top: 14px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    .person .tag { flex: none; }
    @media (max-width: 420px) { .tab { padding: 12px 6px 13px; gap: 6px; font-size: 14px; } }
    @media (max-width: 400px) { .person .tag { font-size: 10px; padding: 1px 4px; } .person { font-size: 13.5px; } }
    @media (max-width: 340px) { .tiles { grid-template-columns: minmax(0, 1fr); } .tab { padding: 12px 8px; font-size: 14px; } }
  </style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <button class="icon-btn" id="menuBtn" aria-label="Manage rosters">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="wordmark">cluster<span>it</span></div>
    <button class="icon-btn bell" id="bellBtn" aria-label="Coverage alerts">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot"></span>
    </button>
    <button class="avatar" id="avatarBtn" aria-label="Choose who you are">?</button>
    <button class="icon-btn" id="moreBtn" aria-label="More">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="day" role="tab"><span class="num" id="numDay">1</span>Roster</button>
    <button class="tab" data-view="week" role="tab"><span class="num"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>Week</button>
    <button class="tab" data-view="duty" role="tab"><span class="num" id="numDuty">–</span>On duty</button>
    <button class="tab" data-view="me" role="tab"><span class="num"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Me</button>
  </nav>

  <main>
    <section class="view" id="view-day">
      <div class="cal" id="calDay"></div>
      <div id="dayBody"><div class="skeleton"></div></div>
    </section>

    <section class="view" id="view-week" hidden>
      <div class="cal" id="calWeek"></div>
      <div id="weekBody"><div class="skeleton"></div></div>
    </section>

    <section class="view" id="view-duty" hidden>
      <div id="dutyBody"><div class="skeleton"></div></div>
    </section>

    <section class="view" id="view-me" hidden>
      <div id="meBody"><div class="skeleton"></div></div>
    </section>
  </main>

  <div class="bottombar">
    <div class="bottombar-inner" id="bottombar"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WINDOWS = { M: '08:00 – 17:00', B: '12:00 – 21:00', E: '15:00 – 23:00', N: '23:00 – 08:00' };

  const state = {
    view: 'day',
    meta: null,
    today: null,
    selected: null,
    stripStart: null,
    day: null,
    strip: null,
    me: load('roster.me') || '',
    pin: sessionLoad('roster.pin') || ''
  };

  // ---------- utils ----------
  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function sessionLoad(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
  function sessionSave(k, v) { try { sessionStorage.setItem(k, v); } catch {} }
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plain = label => String(label || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
  const toUTC = k => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const toKey = d => d.toISOString().slice(0, 10);
  const addDays = (k, n) => { const d = toUTC(k); d.setUTCDate(d.getUTCDate() + n); return toKey(d); };
  const dow = k => toUTC(k).getUTCDay();
  const dnum = k => toUTC(k).getUTCDate();
  const mon = k => MONTHS[toUTC(k).getUTCMonth()];
  const sundayOf = k => addDays(k, -dow(k));
  const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  const sameName = (a, b) => norm(a) === norm(b);
  const norm = n => String(n || '').toLowerCase().replace(/[,.]/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');

  function kind(code) {
    if (['M', 'B', 'E', 'N'].includes(code)) return code;
    if (['T', 'TR'].includes(code)) return 'task';
    if (['OFF', 'X', 'Z'].includes(code)) return 'off';
    return 'leave';
  }

  function rangeLabel(a, b) {
    const ya = toUTC(a).getUTCFullYear(), yb = toUTC(b).getUTCFullYear();
    if (mon(a) === mon(b)) return `${mon(a)} ${dnum(a)}–${dnum(b)}, ${yb}`;
    return `${mon(a)} ${dnum(a)} – ${mon(b)} ${dnum(b)}, ${ya === yb ? yb : ''}`.replace(/, $/, '');
  }

  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (state.pin) headers['x-admin-pin'] = state.pin;
    const res = await fetch(path, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; throw e; }
    return body;
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- sheet ----------
  function openSheet(html, onMount) {
    $('sheetInner').innerHTML = `<div class="grabber"></div>${html}`;
    $('scrim').classList.add('open');
    $('sheet').classList.add('open');
    onMount && onMount($('sheetInner'));
  }
  function closeSheet() { $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); }
  $('scrim').onclick = closeSheet;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return closeSheet();
    if (e.target.matches('input, select, textarea') || $('sheet').classList.contains('open')) return;
    if (state.view === 'day' && e.key === 'ArrowLeft') selectDate(addDays(state.selected, -1));
    if (state.view === 'day' && e.key === 'ArrowRight') selectDate(addDays(state.selected, 1));
  });

  // ---------- saving (handles PIN) ----------
  async function saveDaily(fields) {
    try {
      const r = await api('/api/daily-data', { method: 'POST', body: JSON.stringify({ date: state.selected, ...fields }) });
      state.day.daily = r.data;
      return true;
    } catch (e) {
      if (e.status === 401) { askPin(() => saveDaily(fields).then(ok => ok && render())); return false; }
      toast(e.message);
      return false;
    }
  }

  function askPin(retry) {
    openSheet(`
      <h2>Enter admin PIN</h2>
      <p class="hint">Changes to the roster need the team PIN.</p>
      <div class="me-pick" style="margin-top:12px"><input class="input" id="pinInput" type="password" inputmode="numeric" autocomplete="off"></div>
      <div class="sheet-actions"><button class="ghost" id="pinCancel">Cancel</button><button class="primary" id="pinOk">Unlock</button></div>`,
      el => {
        const inp = el.querySelector('#pinInput');
        inp.focus();
        const go = () => { state.pin = inp.value.trim(); sessionSave('roster.pin', state.pin); closeSheet(); retry(); };
        el.querySelector('#pinOk').onclick = go;
        inp.onkeydown = e => { if (e.key === 'Enter') go(); };
        el.querySelector('#pinCancel').onclick = closeSheet;
      });
  }

  // ---------- data shaping ----------
  function effectiveEntries() {
    const d = state.day;
    const overrides = d.daily.shiftOverrides || {};
    const labelOf = Object.fromEntries(d.shiftCodes.map(s => [s.code, s.label]));
    return d.entries.map(e => {
      const code = overrides[e.name];
      return code && labelOf[code] ? { ...e, code, label: labelOf[code], rawTime: null, modified: true, originalCode: e.code } : e;
    });
  }

  function groupEntries(entries) {
    const groups = {};
    entries.forEach(e => (groups[e.label] ||= []).push(e));
    return state.day.shiftOrder.filter(l => groups[l]).map(label => ({ label, code: groups[label][0].code, employees: groups[label] }));
  }

  function pickInCharge(names, override) {
    if (override && names.includes(override)) return { name: override, manual: true };
    for (const p of state.day.inChargePriority) {
      const hit = names.find(n => sameName(n, p));
      if (hit) return { name: hit, manual: false };
    }
    return null;
  }

  function dayModel() {
    const entries = effectiveEntries();
    const groups = groupEntries(entries);
    const working = groups.filter(g => ['M', 'B', 'E', 'N'].includes(g.code));
    const other = groups.filter(g => !['M', 'B', 'E', 'N'].includes(g.code));
    const icMap = state.day.daily.inCharge || {};
    const ic = {};
    working.forEach(g => { ic[g.label] = pickInCharge(g.employees.map(e => e.name), icMap[g.label]); });
    const counts = { M: 0, B: 0, E: 0, N: 0 };
    entries.forEach(e => { if (counts[e.code] !== undefined) counts[e.code]++; });
    const gaps = state.day.notFound ? [] : state.day.requiredShifts.filter(c => !counts[c]);
    return { entries, groups, working, other, ic, gaps, workingCount: entries.filter(e => ['M', 'B', 'E', 'N', 'T', 'TR'].includes(e.code)).length };
  }

  // ---------- calendar strip ----------
  function renderCal(el, { title, days, canPrev, canNext, onPrev, onNext, onPick, selectable = true }) {
    const avail = new Set(state.day?.availableDates || state.meta?.availableDates || []);
    const gapDays = new Set((state.strip?.days || []).filter((d, i) => state.strip.coverage[i].gaps.length && d.inRoster).map(d => d.key));
    let html = `<div class="cal-head">
      <button class="cal-nav" data-nav="-1" aria-label="Previous" ${canPrev ? '' : 'disabled'}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="cal-title">${esc(title)}</div>
      <button class="cal-nav" data-nav="1" aria-label="Next" ${canNext ? '' : 'disabled'}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div><div class="cal-grid">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}`;
    days.forEach(k => {
      const cls = ['cal-day'];
      if (k === state.today) cls.push('today');
      if (selectable && k === state.selected) cls.push('selected');
      const disabled = !avail.has(k);
      html += `<button class="${cls.join(' ')}" data-key="${k}" ${disabled ? 'disabled' : ''} aria-label="${k}">${dnum(k)}${gapDays.has(k) ? '<span class="gap-dot"></span>' : ''}</button>`;
    });
    el.innerHTML = html + '</div>';
    el.querySelector('[data-nav="-1"]').onclick = onPrev;
    el.querySelector('[data-nav="1"]').onclick = onNext;
    el.querySelectorAll('.cal-day:not(:disabled)').forEach(b => b.onclick = () => onPick(b.dataset.key));
  }

  function stripDays(n = 14) { return Array.from({ length: n }, (_, i) => addDays(state.stripStart, i)); }
  function rosterRange() { const a = state.day?.availableDates || []; return a.length ? [a[0], a[a.length - 1]] : [state.today, state.today]; }

  // ---------- views ----------
  function renderDay() {
    const [first, last] = rosterRange();
    const days = stripDays(14);
    renderCal($('calDay'), {
      title: rangeLabel(days[0], days[13]),
      days,
      canPrev: days[0] > first, canNext: days[13] < last,
      onPrev: () => moveStrip(-7), onNext: () => moveStrip(7),
      onPick: selectDate
    });

    const d = state.day;
    const body = $('dayBody');
    if (d.notFound) {
      body.innerHTML = `<div class="panel"><div class="empty">${esc(d.dateFormatted)} is not in the current roster.<br>Roster covers ${esc(rangeLabel(first, last))}.</div></div>`;
      return;
    }
    const m = dayModel();
    let html = '';
    if (d.isEid) html += `<div class="banner">Eid Mubarak — ${esc(d.dayName)}, ${esc(d.dateFormatted)}</div>`;
    if (m.gaps.length) html += `<div class="banner">No one scheduled on ${m.gaps.map(c => esc(plain(d.shiftCodes.find(s => s.code === c).label))).join(', ')}.</div>`;

    html += `<div class="panel"><div class="panel-head">Timezone: Asia/Riyadh · <strong>${esc(d.dayName)}, ${esc(d.dateFormatted)}</strong></div><div class="tiles">`;
    const shownCodes = new Set(m.working.map(g => g.code));
    ['M', 'B', 'E', 'N'].forEach(code => {
      const g = m.working.find(x => x.code === code);
      const label = plain(d.shiftCodes.find(s => s.code === code).label);
      if (!g) {
        if (!d.requiredShifts.includes(code)) return;
        html += `<div class="tile"><div class="tile-title">${esc(label)}</div><div class="tile-sub warn">Nobody scheduled</div></div>`;
        return;
      }
      const ic = m.ic[g.label];
      html += `<div class="tile"><div class="tile-title">${esc(label)}</div><div class="tile-sub">${WINDOWS[code]} · ${g.employees.length}</div><ul class="people">`;
      g.employees.forEach(e => {
        const tags = [];
        if (ic && ic.name === e.name) tags.push('<span class="tag ic">In-charge</span>');
        if (e.calledIn) tags.push('<span class="tag call">Called in</span>');
        if (e.modified) tags.push('<span class="tag mod">Edited</span>');
        html += `<li><button class="person${sameName(e.name, state.me) ? ' me' : ''}" data-emp="${esc(e.name)}"><span class="nm">${esc(e.name)}${e.rawTime ? ` <small style="color:var(--muted)">${esc(e.rawTime)}</small>` : ''}</span>${tags.join('')}</button></li>`;
      });
      html += '</ul></div>';
    });
    html += '</div>';

    if (m.other.length) {
      html += `<div class="rows" style="margin-top:8px">`;
      m.other.forEach(g => {
        html += `<div class="row"><div class="row-label">${esc(plain(g.label))}</div><div class="row-val">${g.employees.map(e =>
          `<button class="person${sameName(e.name, state.me) ? ' me' : ''}" data-emp="${esc(e.name)}">${esc(e.name)}${e.modified ? ' <span class="tag mod">Edited</span>' : ''}${e.pendingOff ? ' <span class="tag po">Pending off</span>' : ''}</button>`).join(', ')}</div><div class="row-count">${g.employees.length}</div></div>`;
      });
      html += '</div>';
    }
    html += '</div>';

    body.innerHTML = html;
    body.querySelectorAll('[data-emp]').forEach(b => b.onclick = () => editShiftSheet(b.dataset.emp));
  }

  function renderWeek() {
    const [first, last] = rosterRange();
    const days = stripDays(7);
    renderCal($('calWeek'), {
      title: rangeLabel(days[0], days[6]),
      days, selectable: true,
      canPrev: days[0] > first, canNext: days[6] < last,
      onPrev: () => moveStrip(-7), onNext: () => moveStrip(7),
      onPick: k => { selectDate(k); switchView('day'); }
    });
    const w = state.strip;
    if (!w) return;
    const cols = w.days.slice(0, 7);
    let html = `<div class="week-wrap"><table class="week"><thead><tr><th class="name" style="color:var(--muted);font-size:12px">Name</th>${cols.map(d =>
      `<th class="${d.key === state.selected ? 'is-sel' : ''}">${DOW[dow(d.key)]}<b>${dnum(d.key)}</b></th>`).join('')}</tr></thead><tbody>`;
    const rows = [...w.employees].sort((a, b) => (sameName(b.name, state.me) ? 1 : 0) - (sameName(a.name, state.me) ? 1 : 0));
    rows.forEach(emp => {
      html += `<tr class="${sameName(emp.name, state.me) ? 'me' : ''}"><th class="name" title="${esc(emp.name)}">${esc(emp.name)}</th>`;
      emp.shifts.slice(0, 7).forEach((s, i) => {
        if (!cols[i].inRoster) { html += '<td style="color:var(--faint)">·</td>'; return; }
        html += `<td><button class="chip k-${s ? kind(s.code) : 'off'}${s && s.calledIn ? ' called' : ''}" data-edit-key="${cols[i].key}" data-edit-emp="${esc(emp.name)}" title="${s ? esc(plain(s.label)) + (s.calledIn ? ' — called in' : '') : 'Empty'} · tap to change"${s ? '' : ' style="background:none;color:var(--faint)"'}>${s ? esc(s.code) : '–'}</button></td>`;
      });
      html += '</tr>';
    });
    html += `</tbody><tfoot><tr><th class="name" style="color:var(--muted);font-weight:500;font-size:12px">M / E / N</th>${cols.map((d, i) => {
      const c = w.coverage[i];
      return `<td style="${c.gaps.length && d.inRoster ? 'color:var(--red);font-weight:600' : ''}">${d.inRoster ? `${c.counts.M}/${c.counts.E}/${c.counts.N}` : ''}</td>`;
    }).join('')}</tr></tfoot></table></div>
    <p style="color:var(--muted);font-size:12px;margin-top:8px">Tap any cell to change that shift.</p>
    <div class="legend">
      <span><i class="chip k-M">M</i>Morning</span><span><i class="chip k-B">B</i>Between</span><span><i class="chip k-E">E</i>Evening</span><span><i class="chip k-N">N</i>Night</span>
      <span><i class="chip k-off">OFF</i>Off</span><span><i class="chip k-leave">V</i>Leave</span><span><i class="chip k-M called">M</i>Called in</span>
    </div>`;
    $('weekBody').innerHTML = html;
    $('weekBody').querySelectorAll('[data-edit-key]').forEach(b => b.onclick = async () => {
      if (b.dataset.editKey !== state.selected) { state.selected = b.dataset.editKey; await loadDay(); render(); }
      editShiftSheet(b.dataset.editEmp);
    });
  }

  async function renderDuty() {
    const body = $('dutyBody');
    try {
      const d = await api('/api/office-now');
      $('numDuty').textContent = d.employees.length;
      const labels = Object.fromEntries((state.meta?.shiftCodes || []).map(s => [s.code, plain(s.label)]));
      let html = `<div class="clock"><div class="t">${esc(d.time)}</div><div class="s">Riyadh time · ${d.employees.length} on duty</div></div>`;
      if (!d.employees.length) html += '<div class="panel"><div class="empty">Nobody is on shift right now.</div></div>';
      else {
        html += '<div class="rows" style="margin-top:14px">';
        d.employees.forEach(e => {
          const k = kind(e.shiftCode);
          html += `<div class="duty-row"><span class="initials k-${k}">${esc(initials(e.name))}</span><div class="who"><b>${esc(e.name)}</b><small>${esc(labels[e.shiftCode] || e.shiftCode)} · ${esc(e.rawTime || WINDOWS[e.shiftCode] || '')}</small></div>${e.calledIn ? '<span class="tag call">Called in</span>' : ''}</div>`;
        });
        html += '</div>';
      }
      body.innerHTML = html;
    } catch (e) { body.innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}</div></div>`; }
  }

  async function renderMe() {
    const body = $('meBody');
    const names = state.meta?.employees || [];
    let html = `<div class="section-label" style="margin-top:4px">Who are you?</div><div class="me-pick"><select class="input" id="meSelect"><option value="">Select your name</option>${names.map(n =>
      `<option ${sameName(n, state.me) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`;
    let salary = null;
    try { salary = await api('/api/salary'); } catch {}
    if (salary) {
      const pct = Math.max(0, Math.min(100, 100 - salary.daysLeft / (salary.cycleLength || 30) * 100));
      html += `<div class="panel"><div class="panel-head">Countdowns</div><div class="tiles">
        <div class="tile stat-tile"><div class="tile-sub">Salary · ${esc(mon(salary.salaryDate))} ${dnum(salary.salaryDate)}</div><div class="big">${salary.daysLeft} ${salary.daysLeft === 1 ? 'day' : 'days'}</div><div class="bar"><i style="width:${pct}%;background:var(--blue)"></i></div></div>
        <div class="tile stat-tile"><div class="tile-sub">Current roster ends · ${salary.roster ? `${esc(mon(salary.roster.end))} ${dnum(salary.roster.end)}` : '—'}</div><div class="big">${salary.roster ? (salary.roster.ended ? 'Ended' : `${salary.roster.daysLeft} ${salary.roster.daysLeft === 1 ? 'day' : 'days'}`) : '—'}</div></div>
      </div></div>`;
    }
    if (state.me) {
      try {
        const s = await api(`/api/employee?name=${encodeURIComponent(state.me)}&days=14`);
        html += `<div class="section-label">Your next 14 days</div><div class="rows">`;
        s.days.forEach(d => {
          const sh = d.shift;
          let what;
          if (!d.inRoster) what = '<span style="color:var(--faint)">Not in roster yet</span>';
          else if (!sh) what = '<span style="color:var(--faint)">—</span>';
          else what = `${esc(plain(sh.label))}${sh.calledIn ? ' <span class="tag call">Called in</span>' : ''}<small>${esc(sh.rawTime || WINDOWS[sh.code] || '')}</small>`;
          html += `<div class="day-row${d.key === state.today ? ' today' : ''}"><div class="d"><small>${DOW[dow(d.key)]}</small><b>${dnum(d.key)}</b></div><div class="what">${what}</div>${sh ? `<span class="chip k-${kind(sh.code)}">${esc(sh.code)}</span>` : ''}</div>`;
        });
        html += '</div>';
      } catch { html += '<div class="panel"><div class="empty">Couldn’t find your schedule.</div></div>'; }
    }
    body.innerHTML = html;
    $('meSelect').onchange = e => setMe(e.target.value);
  }

  function setMe(name) {
    state.me = name;
    save('roster.me', name);
    $('avatarBtn').textContent = name ? initials(name) : '?';
    render();
  }

  // ---------- bottom bar ----------
  function renderBottom() {
    const bb = $('bottombar');
    if (!state.day) {
      bb.innerHTML = '<div class="bb-actions"><button class="primary" id="bbRosters">Manage rosters</button></div>';
      $('bbRosters').onclick = rostersSheet;
      return;
    }
    const todayBtn = `<button class="sq-btn" id="bbToday" aria-label="Go to today" title="Today"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg></button>`;
    if (state.view === 'day' && state.day && !state.day.notFound) {
      const m = dayModel();
      const icList = m.working.map(g => m.ic[g.label] && `${plain(g.label)}: ${m.ic[g.label].name}`).filter(Boolean);
      bb.innerHTML = `
        <div class="bb-line"><div class="bb-main">${esc(state.day.dayName)}, ${esc(state.day.dateFormatted)}</div>
          <button class="link-btn" id="bbEdit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit</button></div>
        <div class="bb-line"><div class="bb-sub" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">In-charge · ${esc(icList.map(s => s.split(': ')[1]).join(', ') || '—')}</div></div>
        <div class="bb-line" style="margin-top:6px"><div class="bb-strong">Working:</div><div class="bb-strong">${m.workingCount}</div></div>
        <div class="bb-actions">${todayBtn}<button class="primary" id="bbShare">Share on WhatsApp</button></div>`;
      $('bbEdit').onclick = editInChargeSheet;
      $('bbShare').onclick = share;
    } else {
      const label = { day: 'Roster', week: 'Week view', duty: 'On duty now', me: state.me || 'My schedule' }[state.view];
      bb.innerHTML = `<div class="bb-line"><div class="bb-main">${esc(label)}</div><div class="bb-sub">${state.day ? esc(rangeLabel(...rosterRange())) : ''}</div></div>
        <div class="bb-actions">${todayBtn}<button class="primary" id="bbPrimary">${state.view === 'duty' ? 'Refresh' : 'Open today’s roster'}</button></div>`;
      $('bbPrimary').onclick = () => state.view === 'duty' ? renderDuty() : (selectDate(state.today), switchView('day'));
    }
    $('bbToday').onclick = () => selectDate(state.today);
  }

  // ---------- sheets ----------
  function editShiftSheet(name) {
    const d = state.day;
    const orig = d.entries.find(e => e.name === name);
    const current = (d.daily.shiftOverrides || {})[name] || '';
    const opts = d.shiftCodes.map(s => `<button class="opt${s.code === current ? ' on' : ''}" data-code="${s.code}"><span class="radio"></span>${esc(plain(s.label))}<small>${esc(s.code)}</small></button>`).join('');
    openSheet(`<h2>${esc(name)}</h2><p class="hint">Scheduled: ${esc(orig ? plain(orig.label) : '—')}. Pick a different shift for ${esc(d.dateFormatted)}.</p>
      <div class="opt-list">${opts}</div>
      <div class="sheet-actions"><button class="ghost" id="resetShift" ${current ? '' : 'disabled'}>Reset to original</button><button class="primary" id="doneShift">Done</button></div>`, el => {
      el.querySelectorAll('[data-code]').forEach(b => b.onclick = async () => {
        const ov = { ...(d.daily.shiftOverrides || {}) };
        if (orig && b.dataset.code === orig.code) delete ov[name]; else ov[name] = b.dataset.code;
        if (await saveDaily({ shiftOverrides: ov })) { closeSheet(); render(); toast('Shift updated'); }
      });
      el.querySelector('#resetShift').onclick = async () => {
        const ov = { ...(d.daily.shiftOverrides || {}) };
        delete ov[name];
        if (await saveDaily({ shiftOverrides: ov })) { closeSheet(); render(); toast('Reset to original'); }
      };
      el.querySelector('#doneShift').onclick = closeSheet;
    });
  }

  function editInChargeSheet() {
    const m = dayModel();
    if (!m.working.length) return toast('No working shifts on this day');
    const saved = state.day.daily.inCharge || {};
    let html = `<h2>In-charge per shift</h2><p class="hint">Picked automatically by priority unless you choose someone.</p>`;
    m.working.forEach(g => {
      html += `<div class="section-label">${esc(plain(g.label))}</div><div class="opt-list">
        <button class="opt${!saved[g.label] ? ' on' : ''}" data-shift="${esc(g.label)}" data-name=""><span class="radio"></span>Automatic<small>${esc(pickInCharge(g.employees.map(e => e.name), null)?.name || '—')}</small></button>
        ${g.employees.map(e => `<button class="opt${saved[g.label] === e.name ? ' on' : ''}" data-shift="${esc(g.label)}" data-name="${esc(e.name)}"><span class="radio"></span>${esc(e.name)}</button>`).join('')}</div>`;
    });
    html += `<div class="sheet-actions"><button class="primary" id="icDone">Done</button></div>`;
    openSheet(html, el => {
      el.querySelectorAll('[data-shift]').forEach(b => b.onclick = async () => {
        const ic = { ...saved };
        if (b.dataset.name) ic[b.dataset.shift] = b.dataset.name; else delete ic[b.dataset.shift];
        if (await saveDaily({ inCharge: ic })) { render(); editInChargeSheet(); }
      });
      el.querySelector('#icDone').onclick = closeSheet;
    });
  }

  function fmtUploaded(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  async function rostersSheet() {
    let list;
    try { list = await api('/api/rosters'); } catch (e) { return toast(e.message); }
    const files = [...list.files].reverse();
    const today = state.today;
    const rows = files.map(f => {
      const current = f.start <= today && today <= f.end;
      return `<div class="file-row">
        <div class="file-main"><b>${esc(f.file)}</b>${current ? ' <span class="tag mod">Current</span>' : ''}${f.activeDays === 0 ? ' <span class="tag po">Fully replaced</span>' : ''}
          <small>${esc(rangeLabel(f.start, f.end))} · ${f.employees} people · uploaded ${esc(fmtUploaded(f.uploadedAt))}</small>
          ${f.ignoredDates ? `<small>${f.ignoredDates} stray date column(s) ignored</small>` : ''}</div>
        <a class="link-btn" href="/api/rosters/${encodeURIComponent(f.file)}" download aria-label="Download ${esc(f.file)}" title="Download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></a>
        <button class="link-btn" data-archive="${esc(f.file)}" aria-label="Remove ${esc(f.file)}" title="Remove"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      </div>`;
    }).join('');
    openSheet(`<h2>Rosters</h2>
      <p class="hint">All rosters are joined by date. Where two overlap, the latest upload wins for those days. Uploading a file with the same name replaces it.</p>
      <div class="rows" style="margin-top:12px">${rows || '<div class="empty">No rosters yet.</div>'}</div>
      ${list.uploadsEnabled ? '' : '<div class="banner">Uploads are off. Set <b>ADMIN_PIN</b> on the server to turn them on.</div>'}
      <input type="file" id="rosterFile" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      <div class="sheet-actions"><button class="ghost" id="rsClose">Close</button><button class="primary" id="rsUpload" ${list.uploadsEnabled ? '' : 'disabled'}>Upload roster</button></div>`, el => {
      el.querySelector('#rsClose').onclick = closeSheet;
      const input = el.querySelector('#rosterFile');
      el.querySelector('#rsUpload').onclick = () => input.click();
      input.onchange = () => input.files[0] && uploadRoster(input.files[0]);
      el.querySelectorAll('[data-archive]').forEach(b => b.onclick = () => confirmArchive(b.dataset.archive));
    });
  }

  async function uploadRoster(file) {
    if (!/\.xlsx$/i.test(file.name)) return toast('Choose an .xlsx file');
    const headers = { 'Content-Type': 'application/octet-stream' };
    if (state.pin) headers['x-admin-pin'] = state.pin;
    toast('Uploading…');
    const res = await fetch(`/api/rosters?name=${encodeURIComponent(file.name)}`, { method: 'POST', headers, body: file });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) return askPin(() => uploadRoster(file));
    if (!res.ok) return toast(body.error || 'Upload failed');
    toast(`${body.replaced ? 'Replaced' : 'Added'} ${body.file} · ${rangeLabel(body.start, body.end)}`);
    await reloadAll();
    rostersSheet();
  }

  function confirmArchive(file) {
    openSheet(`<h2>Remove ${esc(file)}?</h2><p class="hint">It stops showing in the roster. The file is moved to the server's archive folder, not deleted.</p>
      <div class="sheet-actions"><button class="ghost" id="caNo">Cancel</button><button class="primary" id="caYes" style="background:var(--red)">Remove</button></div>`, el => {
      el.querySelector('#caNo').onclick = rostersSheet;
      el.querySelector('#caYes').onclick = async () => {
        try { await api(`/api/rosters/${encodeURIComponent(file)}`, { method: 'DELETE' }); }
        catch (e) { if (e.status === 401) return askPin(() => confirmArchive(file)); return toast(e.message); }
        toast('Roster removed');
        await reloadAll();
        rostersSheet();
      };
    });
  }

  async function reloadAll() {
    state.meta = await api('/api/meta');
    state.strip = null;
    const r = state.meta.range;
    if (!r) { state.day = null; $('dayBody').innerHTML = '<div class="panel"><div class="empty">No roster uploaded yet.</div></div>'; renderBottom(); return; }
    if (state.selected < r.start || state.selected > r.end) state.selected = state.today < r.start ? r.start : state.today > r.end ? r.end : state.today;
    state.stripStart = sundayOf(state.selected);
    await loadDay();
    render();
  }

  function alertsSheet() {
    const w = state.strip;
    const items = w ? w.days.map((d, i) => ({ d, c: w.coverage[i] })).filter(x => x.d.inRoster && x.c.gaps.length) : [];
    const labels = Object.fromEntries((state.meta?.shiftCodes || []).map(s => [s.code, plain(s.label)]));
    openSheet(`<h2>Coverage gaps</h2><p class="hint">Days in view with a required shift left empty.</p>
      ${items.length ? `<div class="opt-list">${items.map(x => `<button class="opt" data-key="${x.d.key}"><span class="initials k-off" style="width:30px;height:30px;font-size:12px">${dnum(x.d.key)}</span>${esc(x.d.dayName)}<small>${x.c.gaps.map(g => esc(labels[g] || g)).join(', ')}</small></button>`).join('')}</div>`
        : '<div class="empty">All required shifts are covered.</div>'}
      <div class="sheet-actions"><button class="primary" id="alClose">Close</button></div>`, el => {
      el.querySelectorAll('[data-key]').forEach(b => b.onclick = () => { closeSheet(); selectDate(b.dataset.key); switchView('day'); });
      el.querySelector('#alClose').onclick = closeSheet;
    });
  }

  function share() {
    const d = state.day, m = dayModel();
    let text = `*${d.dayName}, ${d.dateFormatted} — Roster*\n`;
    m.groups.forEach(g => {
      const ic = m.ic[g.label];
      text += `\n${plain(g.label)}:\n` + g.employees.map(e => `- ${e.name}${e.rawTime ? ` (${e.rawTime})` : ''}${ic && ic.name === e.name ? ' (in-charge)' : ''}${e.calledIn ? ' — called in' : ''}`).join('\n') + '\n';
    });
    if (m.gaps.length) text += `\nNo one on: ${m.gaps.map(c => plain(d.shiftCodes.find(s => s.code === c).label)).join(', ')}\n`;
    if (navigator.share && /Mobi/i.test(navigator.userAgent)) { navigator.share({ text }).catch(() => {}); return; }
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
  }

  // ---------- navigation ----------
  async function selectDate(key) {
    const [first, last] = rosterRange();
    if (state.day && (key < first || key > last)) return;
    state.selected = key;
    const days = stripDays(14);
    if (!state.stripStart || key < days[0] || key > days[13]) state.stripStart = sundayOf(key);
    await loadDay();
    render();
  }

  async function moveStrip(delta) {
    state.stripStart = addDays(state.stripStart, delta);
    if (state.view === 'week') {
      const [first, last] = rosterRange();
      let k = addDays(state.selected, delta);
      if (k < first) k = first; if (k > last) k = last;
      state.selected = k;
      await loadDay();
    }
    await loadStrip();
    render();
  }

  async function loadDay() {
    state.day = await api(`/api/roster?date=${state.selected}`);
    state.today = state.day.today;
    await loadStrip();
  }

  async function loadStrip() {
    const key = state.stripStart;
    if (state.strip && state.strip.start === key) return;
    try { state.strip = await api(`/api/week?date=${key}&days=14`); } catch { state.strip = null; }
  }

  function switchView(v) {
    state.view = v;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
    document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== `view-${v}`);
    if (v === 'week') { state.stripStart = sundayOf(state.selected); loadStrip().then(render); return; }
    if (v === 'day') state.stripStart = sundayOf(state.selected);
    render();
  }

  function render() {
    if (!state.day) return;
    const m = !state.day.notFound ? dayModel() : null;
    const num = $('numDay');
    num.className = 'num' + (m ? (m.gaps.length ? ' warn' : ' ok') : '');
    num.innerHTML = m ? (m.gaps.length ? '!' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') : '1';
    const anyGaps = state.strip && state.strip.days.some((d, i) => d.inRoster && d.key >= state.today && state.strip.coverage[i].gaps.length);
    $('bellBtn').classList.toggle('has-alert', !!anyGaps);

    if (state.view === 'day') renderDay();
    if (state.view === 'week') renderWeek();
    if (state.view === 'duty') renderDuty();
    if (state.view === 'me') renderMe();
    renderBottom();
  }

  // ---------- boot ----------
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => switchView(t.dataset.view));
  $('menuBtn').onclick = rostersSheet;
  $('moreBtn').onclick = rostersSheet;
  $('bellBtn').onclick = alertsSheet;
  $('avatarBtn').onclick = () => switchView('me');
  $('avatarBtn').textContent = state.me ? initials(state.me) : '?';

  (async function boot() {
    try {
      state.meta = await api('/api/meta');
      state.today = state.meta.today;
      const r = state.meta.range;
      if (!r) { $('dayBody').innerHTML = '<div class="panel"><div class="empty">No roster uploaded yet. Open the menu to upload one.</div></div>'; renderBottom(); return; }
      let start = state.today;
      if (r && (start < r.start || start > r.end)) start = start < r.start ? r.start : r.end;
      state.selected = start;
      state.stripStart = sundayOf(start);
      await loadDay();
      render();
      api('/api/office-now').then(d => { $('numDuty').textContent = d.employees.length; }).catch(() => {});
    } catch (e) {
      $('dayBody').innerHTML = `<div class="panel"><div class="empty">Couldn’t load the roster: ${esc(e.message)}</div></div>`;
    }
  })();

  // Refresh every 5 minutes, unless a sheet is open
  setInterval(async () => {
    if ($('sheet').classList.contains('open') || document.hidden) return;
    try { state.strip = null; await loadDay(); render(); } catch {}
  }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
